<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Mohammadi Saree House</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logo/mohammadi-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<style>
  .admin { max-width: 560px; margin: 0 auto; padding: var(--spacing-75) var(--spacing-20); }
  .admin__card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: var(--card-padding);
    margin-bottom: var(--spacing-23);
  }
  .admin__field { margin-bottom: var(--spacing-20); }
  .admin__field label { display: block; margin-bottom: var(--spacing-9); color: var(--color-stone); font-size: 13px; }
  .admin__field input[type="password"],
  .admin__field input[type="text"],
  .admin__field input[type="file"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.25);
    color: var(--color-linen);
    font-family: var(--font-raleway);
    font-size: 14px;
  }
  .admin__status { margin-top: var(--spacing-15); font-size: 13px; color: var(--color-stone); }
  .admin__status.is-error { color: #e08a8a; }
  .admin__status.is-ok { color: var(--color-brand-green-light); }
  .admin__gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: var(--spacing-10); }
  .admin__gallery img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; }
  .btn { border: 1px solid rgba(255, 255, 255, 0.18); cursor: pointer; }
</style>
</head>
<body>

<main class="admin">
  <p class="eyebrow">Mohammadi Saree House</p>
  <h1 class="section-heading section-heading--left" style="font-size: 28px;">Upload a Product Photo</h1>

  <div class="admin__card">
    <form id="uploadForm">
      <div class="admin__field">
        <label for="adminPassword">Admin password</label>
        <input type="password" id="adminPassword" autocomplete="current-password" required>
      </div>
      <div class="admin__field">
        <label for="photoFile">Photo</label>
        <input type="file" id="photoFile" accept="image/*" required>
      </div>
      <div class="admin__field">
        <label for="photoAlt">Description (optional, for accessibility)</label>
        <input type="text" id="photoAlt" placeholder="e.g. Red embroidered saree">
      </div>
      <button type="submit" class="btn btn--filled">Upload</button>
      <p class="admin__status" id="uploadStatus"></p>
    </form>
  </div>

  <div class="admin__card">
    <h3 class="footer__heading" style="margin-bottom: var(--spacing-20);">Recently Uploaded</h3>
    <div class="admin__gallery" id="gallery"></div>
  </div>
</main>

<script>
  const form = document.getElementById('uploadForm');
  const status = document.getElementById('uploadStatus');
  const gallery = document.getElementById('gallery');

  const setStatus = (msg, kind) => {
    status.textContent = msg;
    status.className = 'admin__status' + (kind ? ` is-${kind}` : '');
  };

  const loadGallery = async () => {
    const res = await fetch('/api/products');
    const products = res.ok ? await res.json() : [];
    gallery.replaceChildren(...products.map((p) => {
      const img = document.createElement('img');
      img.src = p.url;
      img.alt = p.alt || '';
      img.loading = 'lazy';
      return img;
    }));
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('adminPassword').value;
    const file = document.getElementById('photoFile').files[0];
    const alt = document.getElementById('photoAlt').value;
    if (!file) return;

    setStatus('Uploading…');
    const body = new FormData();
    body.append('photo', file);
    body.append('alt', alt);

    try {
      const res = await fetch('/api/admin/upload', {
        method: 'POST',
        headers: { Authorization: `Bearer ${password}` },
        body,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Upload failed');
      setStatus('Uploaded! It will now appear in the site\'s Featured Collection.', 'ok');
      form.reset();
      loadGallery();
    } catch (err) {
      setStatus(err.message, 'error');
    }
  });

  loadGallery();
</script>
</body>
</html>
