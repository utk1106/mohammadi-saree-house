<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Mohammadi Saree House</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logo/mohammadi-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<style>
  .admin { max-width: 1000px; margin: 0 auto; padding: var(--spacing-75) var(--spacing-20); }
  .admin__card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: var(--card-padding);
    margin-bottom: var(--spacing-23);
  }
  .admin__field { margin-bottom: var(--spacing-20); }
  .admin__field label { display: block; margin-bottom: var(--spacing-9); color: var(--color-stone); font-size: 13px; }
  .admin__field input[type="password"] {
    width: 100%;
    max-width: 320px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.25);
    color: var(--color-linen);
    font-family: var(--font-raleway);
    font-size: 14px;
  }
  .admin__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--spacing-15); }
  .slot {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: var(--spacing-10);
  }
  .slot__media { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; margin-bottom: var(--spacing-9); background: var(--color-surface-dark); }
  .slot__label { font-size: 12px; color: var(--color-stone); margin-bottom: var(--spacing-9); }
  .slot__file { width: 100%; font-size: 11px; margin-bottom: var(--spacing-9); color: var(--color-stone); }
  .slot__alt { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(0, 0, 0, 0.25); color: var(--color-linen); font-size: 12px; margin-bottom: var(--spacing-9); }
  .slot__btn { width: 100%; font-size: 11px; padding: 10px; }
  .slot__status { margin-top: var(--spacing-9); font-size: 11px; color: var(--color-stone); }
  .slot__status.is-error { color: #e08a8a; }
  .slot__status.is-ok { color: var(--color-brand-green-light); }
</style>
</head>
<body>

<main class="admin">
  <p class="eyebrow">Mohammadi Saree House</p>
  <h1 class="section-heading section-heading--left" style="font-size: 28px;">Replace Collection Photos</h1>

  <div class="admin__card">
    <div class="admin__field">
      <label for="adminPassword">Admin password</label>
      <input type="password" id="adminPassword" autocomplete="current-password">
    </div>
    <p style="color: var(--color-stone); font-size: 13px;">Enter your password once, then replace any slot below with a new photo or video. Each slot always holds exactly one item — uploading replaces whatever is currently there.</p>
  </div>

  <div class="admin__grid" id="slotGrid"></div>
</main>

<script>
  const grid = document.getElementById('slotGrid');
  const passwordInput = document.getElementById('adminPassword');

  const slotMedia = (s) => {
    const el = document.createElement(s.type === 'video' ? 'video' : 'img');
    el.className = 'slot__media';
    el.src = s.url;
    if (s.type === 'video') {
      el.muted = true;
      el.playsInline = true;
      el.preload = 'metadata';
      if (s.poster) el.poster = s.poster;
    } else {
      el.alt = s.alt || '';
      el.loading = 'lazy';
    }
    return el;
  };

  const renderSlot = (s) => {
    const card = document.createElement('div');
    card.className = 'slot';

    const label = document.createElement('div');
    label.className = 'slot__label';
    label.textContent = `Slot ${s.slot} — ${s.type}${s.isOverride ? ' (replaced)' : ''}`;

    const form = document.createElement('form');
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*,video/*';
    fileInput.className = 'slot__file';

    const altInput = document.createElement('input');
    altInput.type = 'text';
    altInput.placeholder = 'Description (optional)';
    altInput.className = 'slot__alt';

    const btn = document.createElement('button');
    btn.type = 'submit';
    btn.className = 'btn btn--filled slot__btn';
    btn.textContent = 'Replace';

    const status = document.createElement('p');
    status.className = 'slot__status';

    form.append(fileInput, altInput, btn, status);
    card.append(slotMedia(s), label, form);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;
      status.textContent = 'Uploading…';
      status.className = 'slot__status';

      const body = new FormData();
      body.append('slot', s.slot);
      body.append('media', file);
      body.append('alt', altInput.value);

      try {
        const res = await fetch('/api/admin/replace', {
          method: 'POST',
          headers: { Authorization: `Bearer ${passwordInput.value.trim()}` },
          body,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Replace failed');
        status.textContent = 'Replaced!';
        status.className = 'slot__status is-ok';
        card.replaceWith(renderSlot({ ...data }));
      } catch (err) {
        status.textContent = err.message;
        status.className = 'slot__status is-error';
      }
    });

    return card;
  };

  fetch('/api/slots')
    .then((res) => res.json())
    .then((slots) => grid.replaceChildren(...slots.map(renderSlot)));
</script>
</body>
</html>
